<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport with viewport-fit=cover for iPhone notch and edge-to-edge screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>SchoolRider - Kiss & Ride Dismissal</title>
    <meta name="description" content="Real-time school dismissal and student pickup management for dispatchers and teachers." />
    
    <!-- Standard & Android PWA Colors and Manifest -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Standard Favicons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />

    <!-- Apple / iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoolRider" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Icons for iPhone, iPad, Retina -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />

    <!-- Production App Assets -->
    <script type="module" crossorigin src="./assets/index-__0x0wn5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3c9mE2m.css">

    <style>
      /* iOS Notch & Safe Area Inset Support */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      body {
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        -webkit-tap-highlight-color: transparent;
      }

      /* PWA Installation Helper Banner */
      #pwa-install-banner {
        position: fixed;
        bottom: calc(16px + var(--sab));
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 480px;
        background: #1e293b;
        color: #ffffff;
        padding: 14px 18px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: pwaSlideUp 0.35s ease-out forwards;
      }

      @keyframes pwaSlideUp {
        from { transform: translate(-50%, 40px); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }

      .pwa-banner-content {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      .pwa-banner-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .pwa-banner-icon img {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }
      .pwa-banner-text {
        display: flex;
        flex-direction: column;
      }
      .pwa-banner-title {
        font-weight: 600;
        font-size: 14px;
        color: #f8fafc;
        line-height: 1.2;
      }
      .pwa-banner-desc {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 2px;
        line-height: 1.3;
      }
      .pwa-banner-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pwa-btn-install {
        background: #2563eb;
        color: #ffffff;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        white-space: nowrap;
      }
      .pwa-btn-install:hover {
        background: #1d4ed8;
      }
      .pwa-btn-close {
        background: transparent;
        color: #94a3b8;
        border: none;
        padding: 6px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .pwa-btn-close:hover {
        color: #ffffff;
      }

      /* iOS Guide Modal */
      #pwa-ios-modal {
        position: fixed;
        bottom: calc(20px + var(--sab));
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 440px;
        background: #ffffff;
        color: #0f172a;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.35);
        display: none;
        flex-direction: column;
        gap: 14px;
        z-index: 10000;
        border: 1px solid #e2e8f0;
        animation: pwaSlideUp 0.35s ease-out forwards;
      }
      .pwa-ios-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .pwa-ios-title {
        font-weight: 700;
        font-size: 16px;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pwa-ios-step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #334155;
        line-height: 1.4;
      }
      .pwa-ios-badge {
        background: #eff6ff;
        color: #2563eb;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        flex-shrink: 0;
      }
      .pwa-ios-icon {
        display: inline-flex;
        vertical-align: middle;
        margin: 0 3px;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-gray-900 min-h-screen">
    <div id="root"></div>

    <!-- PWA Install Prompt Banner (Android / Chrome) -->
    <div id="pwa-install-banner" role="alert">
      <div class="pwa-banner-content">
        <div class="pwa-banner-icon">
          <img src="./apple-touch-icon.png" alt="SchoolRider" />
        </div>
        <div class="pwa-banner-text">
          <span class="pwa-banner-title">Install SchoolRider</span>
          <span class="pwa-banner-desc">Add to Home Screen for offline access</span>
        </div>
      </div>
      <div class="pwa-banner-actions">
        <button id="pwa-install-btn" class="pwa-btn-install">Install</button>
        <button id="pwa-close-btn" class="pwa-btn-close" aria-label="Dismiss">✕</button>
      </div>
    </div>

    <!-- PWA iOS Instructions Modal (Apple Safari) -->
    <div id="pwa-ios-modal" role="dialog" aria-modal="true">
      <div class="pwa-ios-header">
        <div class="pwa-ios-title">
          <img src="./apple-touch-icon.png" width="28" height="28" style="border-radius: 6px;" alt="" />
          Install SchoolRider
        </div>
        <button id="pwa-ios-close-btn" class="pwa-btn-close" style="color: #64748b;" aria-label="Close">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="pwa-ios-step">
          <span class="pwa-ios-badge">1</span>
          <span>Tap the <strong>Share</strong> button <svg class="pwa-ios-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> in Safari's toolbar.</span>
        </div>
        <div class="pwa-ios-step">
          <span class="pwa-ios-badge">2</span>
          <span>Scroll down and tap <strong>Add to Home Screen</strong> <svg class="pwa-ios-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>.</span>
        </div>
      </div>
    </div>

    <!-- Service Worker Registration & PWA Install Handling -->
    <script>
      // 1. Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('SchoolRider PWA: Service Worker registered successfully, scope:', reg.scope);
            })
            .catch(err => {
              console.log('SchoolRider PWA: SW registration failed:', err);
            });
        });
      }

      // 2. Standalone Mode Detection (Both iOS & Android)
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                           window.navigator.standalone === true || 
                           document.referrer.includes('android-app://');

      // 3. Platform Detection
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      let deferredInstallPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');
      const iosModal = document.getElementById('pwa-ios-modal');
      const iosCloseBtn = document.getElementById('pwa-ios-close-btn');

      // 4. Android / Chrome Install Prompt Event
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent immediate Chrome mini-infobar
        e.preventDefault();
        deferredInstallPrompt = e;

        // Show banner if not in standalone and not recently dismissed
        const isDismissed = localStorage.getItem('pwa_prompt_dismissed_at');
        const now = Date.now();
        if (!isStandalone && (!isDismissed || (now - parseInt(isDismissed, 10)) > 7 * 24 * 60 * 60 * 1000)) {
          if (banner) banner.style.display = 'flex';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            console.log('PWA install choice:', outcome);
            deferredInstallPrompt = null;
            if (banner) banner.style.display = 'none';
          }
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (banner) banner.style.display = 'none';
          localStorage.setItem('pwa_prompt_dismissed_at', Date.now().toString());
        });
      }

      // 5. iOS Safari Install Modal Logic
      if (isIOS && isSafari && !isStandalone) {
        const isIOSDismissed = localStorage.getItem('pwa_ios_modal_dismissed_at');
        const now = Date.now();
        // Show after 3 seconds on first visit
        if (!isIOSDismissed || (now - parseInt(isIOSDismissed, 10)) > 7 * 24 * 60 * 60 * 1000) {
          setTimeout(() => {
            if (iosModal) iosModal.style.display = 'flex';
          }, 3000);
        }
      }

      if (iosCloseBtn) {
        iosCloseBtn.addEventListener('click', () => {
          if (iosModal) iosModal.style.display = 'none';
          localStorage.setItem('pwa_ios_modal_dismissed_at', Date.now().toString());
        });
      }

      // 6. App Installed Event
      window.addEventListener('appinstalled', () => {
        console.log('SchoolRider PWA installed successfully!');
        if (banner) banner.style.display = 'none';
        if (iosModal) iosModal.style.display = 'none';
        deferredInstallPrompt = null;
      });
    </script>
  </body>
</html>
